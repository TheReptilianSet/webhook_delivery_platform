[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhook-delivery-platform"
version = "0.1.0"
description = "Durable multi-tenant callback delivery for asynchronous media processing"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery>=5.5,<6",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.16,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "testcontainers[postgres,rabbitmq]>=4.10,<5",
]
security = ["pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_platform"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/webhook_platform/**/api/*.py" = ["B008"]
"src/webhook_platform/api_dependencies.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kombu", "kombu.*", "celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["webhook_platform.worker"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: pure unit tests",
  "api: API tests",
  "integration: PostgreSQL/RabbitMQ integration tests",
  "security: security regression tests",
  "e2e: Compose end-to-end tests",
  "load: local load and failure tests",
]

[tool.coverage.run]
branch = true
source = ["webhook_platform"]
